*{box-sizing:border-box}body{margin:0;font-family:Inter,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--g);line-height:1.5}
a{color:inherit;text-decoration:none}img{max-width:100%}
#hd{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 1px 0 var(--bd)}
.top{max-width:1240px;margin:auto;display:flex;align-items:center;gap:16px;padding:14px 20px;transition:padding .35s ease}
.lg svg{width:auto;height:44px;display:block;transition:height .35s ease}
.sr{flex:1;position:relative;display:flex}.sr input{flex:1;padding:11px 14px;border:2px solid var(--g);border-right:0;border-radius:8px 0 0 8px;font:inherit;outline:0}
.sr button{background:var(--g);color:#fff;border:0;padding:0 18px;border-radius:0 8px 8px 0;font-weight:700;cursor:pointer}
#sug{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--bd);border-radius:8px;margin-top:4px;box-shadow:0 8px 24px #0002;overflow:hidden}
#sug a,#sug span{display:flex;justify-content:space-between;padding:10px 14px}#sug a:hover{background:var(--bg)}#sug small{color:#777}
.btn{padding:10px 16px;border-radius:8px;font-weight:700;border:2px solid var(--g);white-space:nowrap}.btn.y{background:var(--y);border-color:var(--y)}
.cats{background:var(--g);max-height:48px;overflow:hidden;transition:max-height .35s ease,opacity .25s ease}
.cats div{max-width:1240px;margin:auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
.cats a{color:#fff;padding:13px 16px;font-weight:600;white-space:nowrap}.cats a:hover{background:var(--r)}
#hd.sm .cats{max-height:0;opacity:0}#hd.sm .top{padding:6px 20px}#hd.sm .lg svg{width:auto;height:30px}
main{max-width:1240px;margin:auto;padding:24px 20px}
.ann{border-left:6px solid var(--y);background:#fff;padding:12px 16px;border-radius:8px;margin-bottom:10px;font-weight:600}.ann.pilne{border-color:var(--r);background:#FFF1F2}.ann.utrudnienia{border-color:#E8710A;background:#FFF7ED}
h2.sec{font-size:22px;font-weight:900;margin:28px 0 14px;border-left:6px solid var(--r);padding-left:10px}
.cat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.cat-tiles a{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:18px;font-weight:800;text-align:center;border-bottom:4px solid var(--y)}.cat-tiles a:hover{border-bottom-color:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0002}
.ph{aspect-ratio:16/9;background:#ddd center/cover}.cb{padding:14px}.cb h3{margin:8px 0 6px;font-size:18px;line-height:1.25}.cb p{margin:0 0 8px;color:#555;font-size:14px}.cb small{color:#777}
.tag{display:inline-block;background:var(--y);font-size:12px;font-weight:800;padding:3px 9px;border-radius:5px;text-transform:uppercase}
.art{max-width:800px;margin:auto;background:#fff;border-radius:14px;padding:28px;border:1px solid var(--bd)}.art h1{font-size:34px;line-height:1.15;margin:10px 0}
.art .cover{width:100%;border-radius:10px;margin:14px 0}.art p,.art li{font-size:18px}.art blockquote{border-left:6px solid var(--r);background:var(--bg);margin:18px 0;padding:12px 18px;font-weight:600}
.art figure{margin:18px 0}.art figcaption{color:#777;font-size:13px}
form.cm{display:grid;gap:10px;margin-top:12px}form.cm input,form.cm textarea{padding:11px;border:1px solid var(--bd);border-radius:8px;font:inherit}
form.cm button{background:var(--r);color:#fff;border:0;padding:12px;border-radius:8px;font-weight:800;cursor:pointer}
.c{border-top:1px solid var(--bd);padding:12px 0}.empty{padding:40px;text-align:center;color:#666}
footer{background:var(--g);color:#ccc;margin-top:48px;padding:32px 20px}footer div{max-width:1240px;margin:auto}footer svg{height:40px;width:auto}footer a:hover{color:var(--y)}
.nf{text-align:center;padding:60px 20px}.nf h1{font-size:96px;margin:0;color:var(--r)}
@media(max-width:760px){.top{flex-wrap:wrap}.sr{order:3;flex-basis:100%}.btn{padding:8px 12px}}
.legal h2{font-size:21px;margin:26px 0 8px}.legal p,.legal li{font-size:16px}.legal small{color:#666}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0}}
@keyframes dn{from{transform:translateY(-100%)}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes st{to{background-position:40px 0}}
@keyframes gr{from{transform:scaleX(0)}}
@keyframes pu{0%{box-shadow:0 0 0 0 #FFC20Ecc}100%{box-shadow:0 0 0 14px #FFC20E00}}
@keyframes pu2{0%{box-shadow:0 0 0 0 #D91F2Ecc}100%{box-shadow:0 0 0 10px #D91F2E00}}
@keyframes tr{from{transform:translateX(-80px)}to{transform:translateX(100vw)}}
@keyframes tr2{from{transform:translateX(-60px)}to{transform:translateX(430px)}}
@keyframes shake{0%,90%,100%{transform:none}93%{transform:translateX(-8px) skew(-5deg)}96%{transform:translateX(8px) skew(5deg)}}
body{animation:fi .5s ease}#hd{animation:dn .5s cubic-bezier(.2,.8,.2,1)}
#pb{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--y),var(--r));transform:scaleX(0);transform-origin:0 50%}
.rv{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
.card.rv.in,.cat-tiles a.rv.in{transition:transform .25s,box-shadow .25s,border-color .25s;transition-delay:0s!important}
.card.rv.in:hover{transform:translateY(-5px)}.cat-tiles a.rv.in:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:0 10px 20px #0002}
.cb{position:relative;background:#fff}.ph{transition:transform .5s ease}.card:hover .ph{transform:scale(1.07)}
.ph.noimg{position:relative;overflow:hidden;background:linear-gradient(135deg,#16181D,#2b2f38)}
.ph.noimg::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#FFC20E22 25%,transparent 25% 50%,#FFC20E22 50% 75%,transparent 75%);background-size:40px 40px;animation:st 2.5s linear infinite}
.sk .ph,.sk i{background:linear-gradient(90deg,#e6e8ec 25%,#f4f5f7 50%,#e6e8ec 75%);background-size:200% 100%;animation:sh 1.2s infinite linear}

.btn{transition:transform .15s,box-shadow .15s,background .2s,color .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px #0003}.btn:active{transform:scale(.97)}
.btn.y{animation:pu 2.2s infinite}.btn.w{background:transparent;border-color:#fff;color:#fff}.btn.w:hover{background:#fff;color:var(--g)}

.cats a:hover{background:transparent;color:var(--y)}.cats a:hover::after{transform:scaleX(1)}
.ann{animation:up .5s both}.ann.pilne::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--r);margin-right:10px;animation:pu2 1.2s infinite}
