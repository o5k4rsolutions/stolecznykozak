<style>
:root{--r:#D91F2E;--y:#FFC20E;--g:#16181D;--bg:#F2F3F5;--bd:#D9DCE1}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--g);line-height:1.45}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:2px solid var(--g);background:#fff;border-radius:8px;padding:8px 14px;font-weight:700;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-1px);box-shadow:0 4px 10px #0003}button.pri{background:var(--g);color:#fff}button.y{background:var(--y);border-color:var(--y)}button.d{border-color:var(--r);color:var(--r)}button.d:hover{background:var(--r);color:#fff}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:#fff;margin-top:4px}label{display:block;font-size:13px;font-weight:700;margin:10px 0}
header{background:var(--g);color:#fff;position:sticky;top:0;z-index:5}header>div{max-width:1300px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:18px}header svg{height:34px;width:auto}
nav{display:flex;gap:4px;flex:1}nav button{background:transparent;color:#fff;border:0;border-radius:6px}nav button.on{background:var(--y);color:var(--g)}
main{max-width:1300px;margin:auto;padding:22px 20px}h2{margin:0 0 14px;border-left:6px solid var(--r);padding-left:10px}
.box{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.it{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.it+.it{border-top:1px solid var(--bd);padding-top:12px;margin-top:12px}
.tag{display:inline-block;background:var(--y);font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px;text-transform:uppercase}.tag.dr{background:#ddd}.tag.pe{background:var(--r);color:#fff}
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.pvw{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 90px);overflow:auto}
.blk{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}.blk.over{outline:3px dashed var(--y)}.bh{display:flex;justify-content:space-between;align-items:center}
.hd{cursor:grab;font-weight:800;font-size:13px;user-select:none}.bh button{padding:2px 8px}.add{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

  $('#lf').onsubmit=async e=>{e.preventDefault();const f=e.target;try{const r=await fetch(CFG.SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:f.email.value,password:f.password.value})});const d=await r.json();
   if(!r.ok){$('#le').textContent='Błędny e-mail lub hasło';return}tok=d.access_token;rtok=d.refresh_token||null;sessionStorage.setItem('t',tok);sessionStorage.setItem('r',rtok||'');render()}catch{$('#le').textContent='Brak połączenia'}};return}
 $('#app').innerHTML=`<header><div>${LOGO.replace(/#16181D/g,'#fff')}<nav>${[['art','Artykuły'],['ann','Ogłoszenia'],['com','Komentarze'],['chat','Czat'+(activeN?' ('+activeN+')':'')]].map(([k,n])=>`<button data-t="${k}" class="${tab===k?'on':''}">${n}</button>`).join('')}</nav><label class="av"><input type="checkbox" id="av"> Dostępny na czacie</label><button onclick="logout()">Wyloguj</button></div></header><main id="mn"></main>`;
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;cur=null;render()});
 $('#av').checked=avOn;$('#av').onchange=e=>run(()=>toggleAv(e.target.checked));startBg();
 ({art:cur?edit:list,ann:ann,com:com,chat:chat})[tab]();
}
/* ---------- ARTYKUŁY ---------- */
const tg=s=>`<span class="tag ${s==='published'?'':'dr'}">${s==='published'?'Opublikowany':'Szkic'}</span>`;
function list(){run(async()=>{const a=await db('GET','articles?select=id,short_id,slug,title,status,published_at,category&order=published_at.desc');
 $('#mn').innerHTML=`<div class="it" style="margin-bottom:12px"><h2 style="margin:0">Artykuły (${a.length})</h2><button class="y" id="nw">+ Nowy artykuł</button></div><div class="box">${a.map(x=>`<div class="it"><div>${tg(x.status)} <span class="tag">${esc(x.category||'')}</span><br><b>${esc(x.title)}</b><br><small>${fd(x.published_at)} · ${esc(x.short_id)}</small></div>
 <div class="act" style="margin:0"><button data-e="${x.id}">Edytuj</button>${x.status==='published'?`<a href="/artykuly/${x.short_id}/${x.slug}" target="_blank"><button>Zobacz</button></a><button data-w="${x.short_id}">Discord</button>`:''}<button class="d" data-x="${x.id}">Usuń</button></div></div>`).join('')||'<p class="empty">Brak artykułów.</p>'}</div>`;
 $('#nw').onclick=()=>{cur={title:'',category:'Warszawa',excerpt:'',cover_url:'',tags:'',status:'draft',blocks:[{type:'p',text:''}]};render()};
 $('#mn').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.e)run(async()=>{const [r]=await db('GET','articles?select=*&id=eq.'+d.e);cur={...r,tags:(r.tags||[]).join(', '),blocks:r.blocks||[],orig:r.status};render()});
  if(d.w&&confirm('Wysłać ponownie na Discorda?'))run(()=>hook(d.w).then(m=>alert(m)));
  if(d.x&&confirm('Trwale usunąć artykuł wraz z komentarzami i zdjęciami z Backblaze B2?'))run(async()=>{const r=await af('/api/article-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:d.x})});if(r.status===404){await db('DELETE','articles?id=eq.'+d.x)}else if(!r.ok)throw new Error('Nie udało się usunąć artykułu (kod '+r.status+')');list()})}})}
async function hook(id){const r=await af('/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({short_id:id})});return r.ok?'Wysłano na Discorda':'Webhook nie zadziałał (kod '+r.status+')'}
const blk=b=>{const x=esc(b.text);return b.type=='h'?'<h2>'+x+'</h2>':b.type=='quote'?'<blockquote>'+x+'</blockquote>':b.type=='img'?(b.url?'<figure><img src="'+esc(b.url)+'" alt="">'+(b.caption?'<figcaption>'+esc(b.caption)+'</figcaption>':'')+'</figure>':''):b.type=='ul'?'<ul>'+(b.items||[]).map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>':'<p>'+x+'</p>'};
function pv(){$('#pv').innerHTML=`<span class="tag">${esc(cur.category)}</span><h1>${esc(cur.title||'Tytuł artykułu')}</h1><small>${fd(cur.published_at||new Date())}</small>${cur.cover_url?`<img src="${esc(cur.cover_url)}" alt="" style="width:100%;margin:12px 0">`:''}${cur.blocks.map(blk).join('')}`}
function rb(){$('#bl').innerHTML=cur.blocks.map((b,i)=>`<div class="blk" data-i="${i}"><div class="bh"><span class="hd" draggable="true">⠿ ${TN[b.type]}</span><button data-d="${i}">✕</button></div>${b.type==='img'?`<input data-f="url" placeholder="URL zdjęcia (https://…)" value="${esc(b.url)}"><input data-f="caption" placeholder="Opis zdjęcia" value="${esc(b.caption)}"><input type="file" data-up accept="image/jpeg,image/png,image/webp,image/gif" title="Wgraj zdjęcie do Backblaze B2">`:`<textarea data-f="${b.type==='ul'?'items':'text'}" rows="${b.type==='ul'?4:3}" placeholder="${b.type==='ul'?'Każdy punkt w osobnej linii':''}">${esc(b.type==='ul'?(b.items||[]).join('\n'):b.text)}</textarea>`}</div>`).join('')||'<p class="empty">Dodaj pierwszy klocek.</p>'}
function edit(){
 $('#mn').innerHTML=`<h2>${cur.id?'Edycja artykułu':'Nowy artykuł'}</h2><div class="ed"><div><div class="box"><label>Tytuł<input id="t"></label><div class="row"><label>Kategoria<select id="c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Status<select id="s"><option value="draft">Szkic</option><option value="published">Opublikowany</option></select></label></div>
 <label>Zajawka<textarea id="x" rows="2"></textarea></label><label>Zdjęcie główne (URL)<input id="u" placeholder="https://…"><input type="file" id="uf" accept="image/jpeg,image/png,image/webp,image/gif" title="Wgraj zdjęcie do Backblaze B2"></label><label>Tagi (po przecinku)<input id="g"></label></div>
 <h3>Treść (przeciągaj klocki za ⠿)</h3><div id="bl"></div><div class="add">${Object.entries(TN).map(([k,n])=>`<button data-a="${k}">+ ${n}</button>`).join('')}</div>
 <div class="act"><button class="pri" id="sv">Zapisz</button><button class="y" id="pb">Opublikuj i wyślij na Discord</button><button id="bk">Wróć do listy</button></div><small id="m"></small></div>
 <div class="pvw"><div class="art" id="pv"></div></div></div>`;
 const map={t:'title',c:'category',x:'excerpt',u:'cover_url',g:'tags',s:'status'};
 for(const k in map){const el=$('#'+k);el.value=cur[map[k]]||'';el.oninput=()=>{cur[map[k]]=el.value;pv()}}
 rb();pv();const bl=$('#bl');
 $('#uf').onchange=e=>{const f=e.target.files[0];if(!f)return;run(async()=>{$('#m').textContent='Wgrywanie zdjęcia…';const u=await up(f);cur.cover_url=u;$('#u').value=u;$('#m').textContent='Zdjęcie wgrane';pv()})};
 bl.oninput=e=>{const f=e.target.dataset.f;if(!f)return;const b=cur.blocks[e.target.closest('.blk').dataset.i];b[f]=f==='items'?e.target.value.split('\n').map(s=>s.trim()).filter(Boolean):e.target.value;pv()};
 bl.onchange=e=>{const x=e.target;if(!x.matches('[data-up]')||!x.files[0])return;const i=+x.closest('.blk').dataset.i;run(async()=>{$('#m').textContent='Wgrywanie zdjęcia…';cur.blocks[i].url=await up(x.files[0]);$('#m').textContent='Zdjęcie wgrane';rb();pv()})};
 bl.onclick=e=>{const d=e.target.dataset.d;if(d!==undefined){cur.blocks.splice(+d,1);rb();pv()}};
 bl.ondragstart=e=>{const k=e.target.closest('.blk');if(!k||!e.target.classList.contains('hd'))return;drag=+k.dataset.i;e.dataTransfer.setData('text','x');e.dataTransfer.setDragImage(k,0,0)};
 bl.ondragover=e=>{if(drag===null)return;e.preventDefault();document.querySelectorAll('.blk.over').forEach(x=>x.classList.remove('over'));e.target.closest('.blk')?.classList.add('over')};
 bl.ondrop=e=>{e.preventDefault();const k=e.target.closest('.blk');if(k&&drag!==null){const to=+k.dataset.i,[m]=cur.blocks.splice(drag,1);cur.blocks.splice(to,0,m);rb();pv()}drag=null};
 bl.ondragend=()=>{drag=null;document.querySelectorAll('.blk.over').forEach(x=>x.classList.remove('over'))};
 document.querySelector('.add').onclick=e=>{const k=e.target.dataset.a;if(!k)return;cur.blocks.push(k==='img'?{type:k,url:'',caption:''}:k==='ul'?{type:k,items:[]}:{type:k,text:''});rb();pv()};
 $('#bk').onclick=()=>{if(confirm('Wyjść bez zapisywania zmian?')){cur=null;render()}};
 $('#sv').onclick=()=>save(false);$('#pb').onclick=()=>{if(cur.orig==='published'&&!confirm('Artykuł jest już opublikowany. Zapisać i wysłać ponownie na Discorda?'))return;save(true)}}
function save(pub){run(async()=>{const m=$('#m');if(!cur.title.trim()){m.textContent='Podaj tytuł';return}
 const body={title:cur.title.trim(),category:cur.category,excerpt:cur.excerpt,cover_url:cur.cover_url||null,tags:cur.tags.split(',').map(s=>s.trim()).filter(Boolean),blocks:cur.blocks,status:pub?'published':cur.status};
 if(body.status==='published'&&cur.orig!=='published')body.published_at=new Date().toISOString();
 let r;if(cur.id)[r]=await db('PATCH','articles?id=eq.'+cur.id,body);else{body.short_id=sid();body.slug=slug(body.title);[r]=await db('POST','articles',body)}
 cur={...cur,...r,tags:(r.tags||[]).join(', '),orig:r.status};$('#s').value=r.status;
 m.textContent='Zapisano '+fd(new Date());if(pub)m.textContent+=' · '+await hook(r.short_id);pv()})}
/* ---------- OGŁOSZENIA ---------- */
function ann(){run(async()=>{const a=await db('GET','announcements?select=*&order=created_at.desc');
 $('#mn').innerHTML=`<h2>Ogłoszenia</h2><div class="box"><form id="af" class="row"><label>Treść<input name="text" required maxlength="300"></label><label>Typ<select name="type"><option value="info">Informacja</option><option value="pilne">Pilne</option><option value="utrudnienia">Utrudnienia</option></select></label><button class="y" style="grid-column:1/-1">Dodaj ogłoszenie</button></form></div>
 <div class="box">${a.map(x=>`<div class="it"><div><span class="tag ${x.type==='pilne'?'pe':''}">${esc(x.type)}</span> ${x.active?'':'<span class="tag dr">wyłączone</span>'}<br><b>${esc(x.text)}</b></div><div class="act" style="margin:0"><button data-o="${x.id}" data-v="${x.active}">${x.active?'Wyłącz':'Włącz'}</button><button data-m="${x.id}">Edytuj</button><button class="d" data-x="${x.id}">Usuń</button></div></div>`).join('')||'<p class="empty">Brak ogłoszeń.</p>'}</div>`;
 $('#af').onsubmit=e=>{e.preventDefault();const f=e.target;run(async()=>{await db('POST','announcements',{text:f.text.value.trim(),type:f.type.value});ann()})};
 $('#mn').onclick=e=>{const b=e.target.closest('button'),d=b?.dataset;if(!d)return;
  if(d.o)run(async()=>{await db('PATCH','announcements?id=eq.'+d.o,{active:d.v!=='true'});ann()});
  if(d.m){const t=prompt('Nowa treść ogłoszenia:',a.find(x=>x.id===d.m).text);if(t)run(async()=>{await db('PATCH','announcements?id=eq.'+d.m,{text:t});ann()})}
  if(d.x&&confirm('Usunąć ogłoszenie?'))run(async()=>{await db('DELETE','announcements?id=eq.'+d.x);ann()})}})}
/* ---------- KOMENTARZE ---------- */
let cf='pending';
function com(){run(async()=>{const c=await db('GET',`comments?select=id,name,email,body,ip,status,created_at,articles(title)&status=eq.${cf}&order=created_at.desc&limit=100`);
 $('#mn').innerHTML=`<div class="it" style="margin-bottom:12px"><h2 style="margin:0">Komentarze</h2><select id="cfs" style="width:auto">${[['pending','Oczekujące'],['approved','Zatwierdzone'],['rejected','Odrzucone']].map(([k,n])=>`<option value="${k}" ${cf===k?'selected':''}>${n}</option>`).join('')}</select></div>
 <div class="box">${c.map(x=>`<div class="it"><div style="flex:1;min-width:260px"><b>${esc(x.name)}</b> · ${esc(x.email)} · IP ${esc(x.ip)}<br><small>${fd(x.created_at)} · ${esc(x.articles?.title||'')}</small><p style="margin:6px 0">${esc(x.body)}</p></div>
 <div class="act" style="margin:0">${x.status!=='approved'?`<button class="y" data-s="approved" data-id="${x.id}">Zatwierdź</button>`:''}${x.status==='pending'?`<button data-s="rejected" data-id="${x.id}">Odrzuć</button>`:''}<button class="d" data-x="${x.id}">Usuń</button></div></div>`).join('')||'<p class="empty">Brak komentarzy w tej kategorii.</p>'}</div>`;
 $('#cfs').onchange=e=>{cf=e.target.value;com()};
 $('#mn').onclick=e=>{const b=e.target.closest('button'),d=b?.dataset;if(!d)return;
  if(d.s)run(async()=>{await db('PATCH','comments?id=eq.'+d.id,{status:d.s});com()});
  if(d.x&&confirm('Trwale usunąć komentarz?'))run(async()=>{await db('DELETE','comments?id=eq.'+d.x);com()})}})}
/* ---------- WGRYWANIE ZDJĘĆ (Backblaze B2 przez /api/upload) ---------- */
async function up(f){
 if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type))throw new Error('Dozwolone formaty: JPG, PNG, WebP, GIF');
 if(f.size>10*1024*1024)throw new Error('Plik jest za duży (limit 10 MB)');
 const r=await af('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:f.type})});
 if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error==='b2 not configured'?'Backblaze B2 nie jest skonfigurowany (zmienne B2_* w Cloudflare Pages)':'Nie udało się przygotować wgrywania (kod '+r.status+')')}
 const{uploadUrl,publicUrl}=await r.json();
 const p=await fetch(uploadUrl,{method:'PUT',body:f}).catch(()=>null);
 if(!p||!p.ok)throw new Error('Wgrywanie do B2 nie powiodło się'+(p?' (kod '+p.status+')':' – sprawdź reguły CORS bucketu')); 
 return publicUrl}
/* ---------- CZAT ---------- */
let rf='active',RL=[],shownRid=null,shownSt='',lastSig='',fresh=false;
const rt=d=>new Date(d).toLocaleString('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function chat(){shownRid=null;
 $('#mn').innerHTML=`<div class="it" style="margin-bottom:12px"><h2 style="margin:0">Czat</h2><select id="rf" style="width:auto">${[['active','Aktywne'],['closed','Zakończone']].map(([k,n])=>`<option value="${k}" ${rf===k?'selected':''}>${n}</option>`).join('')}</select></div><div class="chat"><div class="box rl" id="rl"><p class="empty">Ładowanie…</p></div><div class="box cv" id="cv"><p class="empty">Wybierz rozmowę z listy.</p></div></div>`;
 $('#rf').onchange=e=>{rf=e.target.value;rid=null;chat()};
 $('#rl').onclick=e=>{const k=e.target.closest('[data-r]');if(k){rid=k.dataset.r;shownRid=null;rooms();room()}};
 rooms();if(rid)room();
 ct=setInterval(()=>{if(document.hidden)return;rooms();if(rid)room()},3000)}
async function rooms(){try{RL=await db('GET','chat_rooms?select=id,subject,name,last_msg_at&status=eq.'+rf+'&order=last_msg_at.desc&limit=50');const el=$('#rl');if(!el)return;
 el.innerHTML=RL.map(x=>`<div class="ri ${x.id===rid?'on':''}" data-r="${x.id}"><b>${esc(x.subject||'(bez tematu)')}</b><br><small>${esc(x.name)} · ${rt(x.last_msg_at)}</small></div>`).join('')||'<p class="empty">Brak rozmów.</p>';
 if(rf==='active'&&RL.length!==activeN){activeN=RL.length;const b=document.querySelector('nav [data-t=chat]');if(b)b.textContent='Czat'+(activeN?' ('+activeN+')':'')}}catch{}}
async function room(){try{const id=rid;if(!id)return;const[r]=await db('GET','chat_rooms?select=id,subject,name,email,status,created_at&id=eq.'+id);const cv=$('#cv');if(!cv||id!==rid)return;
 if(!r){cv.innerHTML='<p class="empty">Rozmowa nie istnieje.</p>';return}
 if(shownRid!==id||shownSt!==r.status){shownRid=id;shownSt=r.status;lastSig='';fresh=true;
  cv.innerHTML=`<div class="it" style="margin-bottom:8px"><div><b>${esc(r.subject||'')}</b><br><small>${esc(r.name)} · <a href="mailto:${esc(r.email)}">${esc(r.email)}</a> · start ${rt(r.created_at)}</small></div>${r.status==='active'?'<button class="d" id="cc">Zakończ rozmowę</button>':'<span class="tag dr">zakończona</span>'}</div><div class="cmsgs" id="cm"></div>${r.status==='active'?'<form id="cs" class="csend"><input name="body" maxlength="1000" placeholder="Odpowiedz klientowi…" autocomplete="off" required><button class="pri">Wyślij</button></form>':''}`;
  wire(id)}
 const m=await db('GET','chat_messages?select=id,sender,body,created_at&room_id=eq.'+id+'&order=created_at.asc&limit=500');if(id!==rid)return;
 const sig=m.length+':'+(m.length?m[m.length-1].id:'');if(sig===lastSig)return;lastSig=sig;
 const box=$('#cm');if(!box)return;const near=box.scrollHeight-box.scrollTop-box.clientHeight<80;
 box.innerHTML=m.map(x=>`<div class="m ${x.sender==='staff'?'staff':'client'}">${esc(x.body)}<small>${x.sender==='staff'?'Ty':esc(r.name)} · ${rt(x.created_at)}</small></div>`).join('')||'<p class="empty">Brak wiadomości.</p>';
 if(near||fresh){box.scrollTop=box.scrollHeight;fresh=false}}catch{}}
function wire(id){const f=$('#cs'),c=$('#cc');
 if(f){f.elements.body.focus();f.onsubmit=e=>{e.preventDefault();const i=f.elements.body,v=i.value.trim();if(!v)return;i.value='';
  run(async()=>{const r=await af('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a:'send',room_id:id,body:v})});
   if(r.status===409){shownRid=null;alert('Rozmowa jest już zakończona');return}
   if(!r.ok){i.value=v;throw new Error('Nie wysłano wiadomości (kod '+r.status+')')}
   lastSig='';room()})}}
 if(c)c.onclick=()=>{if(confirm('Zakończyć rozmowę? Klient nie będzie mógł już pisać.'))run(async()=>{const r=await af('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a:'close',room_id:id})});if(!r.ok)throw new Error('Nie udało się zakończyć rozmowy (kod '+r.status+')');shownRid=null;rooms();room()})}}

render();
</script></body></html>
